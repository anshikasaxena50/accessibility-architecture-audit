<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Product Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Dynamic Product Explorer</h1>
        <p>Browse products using live REST API data.</p>
    </header>

    <main>
        <section aria-labelledby="controls-heading">
            <h2 id="controls-heading">Product Search and Filters</h2>

            <label for="searchInput">Search products</label>
            <input
                type="search"
                id="searchInput"
                placeholder="Search by product name..."
            >

            <div id="categoryTabs" aria-label="Product categories">
                <button type="button" data-category="all">All</button>
                <button type="button" data-category="electronics">Electronics</button>
                <button type="button" data-category="jewelery">Jewellery</button>
                <button type="button" data-category="men's clothing">Men's Clothing</button>
                <button type="button" data-category="women's clothing">Women's Clothing</button>
            </div>

            <label for="sortSelect">Sort products</label>
            <select id="sortSelect">
                <option value="default">Default</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>
        </section>

        <div id="errorBanner" role="alert" hidden></div>

        <section aria-labelledby="products-heading">
            <h2 id="products-heading">Products</h2>

            <div id="loadingSkeleton" aria-label="Loading products" hidden>
                <p>Loading products...</p>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>

            <div id="productList"></div>
        </section>

        <aside aria-labelledby="cart-heading">
            <h2 id="cart-heading">Shopping Cart</h2>
            <p>Items in cart: <span id="cartCount">0</span></p>
            <button type="button" id="clearCart">Clear Cart</button>
        </aside>
    </main>

    <footer>
        <p>Dynamic JavaScript DOM & REST API Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
